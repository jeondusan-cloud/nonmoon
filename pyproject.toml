[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonmoon"
version = "0.1.0"
description = "물리학 논문 PDF를 한국어 교과서(번역 + 해설) HTML로 바꾸는 도구"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=2.0",
  "pymupdf>=1.24,<2",
  "pyyaml>=6",
  "jsonschema>=4.18",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nonmoon = "nonmoon.cli:main"

[tool.setuptools.packages.find]
include = ["nonmoon*"]

[tool.setuptools.package-data]
nonmoon = [
  "assets/*",
  "assets/katex/*",
  "assets/katex/fonts/*",
  "prompts/*.md",
]
